<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .site-wrapper {
      max-width: 980px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      position: relative;
    }

    .top-banner h1 { 
      font-size: 3.5rem; 
      font-weight: 800; 
      letter-spacing: 3px; 
      color: #ffffff;
      text-align: left;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .grid-container {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(220px, 1fr) minmax(160px, 220px);
      gap: 12px;
      align-items: stretch;
      padding-bottom: 10px;
      width: 100%;
    }

    .col-left, .col-center, .col-right {
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .paper-note-container {
      width: 100%;
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
    }

    .paper-note-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.15));
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
      margin-bottom: 14px;
    }
    .box-header {
      background: #f0f0f3;
      border-bottom: 2px solid #111111;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .box-header-accent {
      background: #F3EEDA;
      border-bottom: 2px solid #111111;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #111111;
    }
    .box-body { padding: 14px; }

    .box-dark {
      background: #111111;
      color: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
      margin-bottom: 14px;
    }
    .box-dark .box-header {
      background: #222222;
      color: #ffffff;
      border-bottom: 2px solid #444444;
    }

    .receipt-box {
      background: #ffffff;
      border: 2px solid #111111;
      padding: 18px 14px;
      box-shadow: 4px 4px 0px #111111;
      margin-bottom: 14px;
      transform: rotate(-2deg);
      transition: transform 0.2s ease;
    }
    .receipt-box:hover { transform: rotate(0deg) scale(1.01); }
    .receipt-title { text-align: center; font-weight: 800; font-size: 0.85rem; }
    .receipt-dash { border: none; border-top: 2px dashed #111; margin: 10px 0; }

    .receipt-menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .receipt-menu-list a {
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.78rem;
      display: block;
      padding: 8px 10px;
      transition: all 0.15s ease;
      cursor: pointer;
      border-radius: 6px;
    }

    .receipt-menu-list a.active, .receipt-menu-list a:hover {
      background: #F3EEDA;
      color: #111111;
    }

    .receipt-barcode {
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .calendar-graphic-dark { 
      width: 36px; height: 36px; border: 2px solid #F3EEDA; border-radius: 6px; background: #222; margin: 0 auto 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 2px 2px 0px #F3EEDA;
    }
    .calendar-graphic-top-dark { background: #F3EEDA; height: 10px; width: 100%; }
    .calendar-graphic-body-dark { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; color: #fff; }

    .mini-calendar-dark { width: 100%; font-size: 0.68rem; text-align: center; border-collapse: collapse; }
    .mini-calendar-dark th, .mini-calendar-dark td { padding: 4px 2px; border: none; color: #ffffff; }
    .mini-calendar-dark th { 
      background: #F3EEDA; 
      color: #111111; 
      font-size: 0.6rem; 
      font-weight: 800; 
      border-radius: 4px; 
    }
    .mini-calendar-dark td.today-dark { background: #F3EEDA; color: #111111; font-weight: 800; border-radius: 4px; }

    .pixel-clock-box-dark {
      background: #111;
      border: 2px solid #111;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      box-shadow: 3px 3px 0px #111;
      margin-bottom: 14px;
    }
    .pixel-clock-time-dark {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: #F3EEDA;
      letter-spacing: 1px;
    }

    .ipod-player-box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
      margin-bottom: 0;
    }
    .ipod-player-inner {
      text-align: center;
      padding: 12px 10px;
    }
    .ipod-screen-clean { 
      background: #222; 
      color: #fff; 
      border: 2px solid #444; 
      border-radius: 12px; 
      padding: 12px 10px; 
      font-size: 0.78rem; 
      font-weight: 700; 
      margin-bottom: 12px; 
      min-height: 55px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .ipod-controls-clean { 
      display: flex; 
      justify-content: center; 
      gap: 12px; 
      align-items: center; 
    }
    .ipod-btn-ctrl-clean { 
      background: #222; 
      color: #fff;
      border: 2px solid #555; 
      border-radius: 50%; 
      width: 36px; 
      height: 36px; 
      font-size: 0.8rem; 
      font-weight: 800; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 2px 2px 0px #444; 
      transition: transform 0.1s ease;
    }
    .ipod-btn-ctrl-clean:active { 
      transform: translate(1px, 1px); 
      box-shadow: 1px 1px 0px #444; 
    }

    .nav-box-btn {
      width: 100%;
      background: #ffffff;
      border: 2px solid #111;
      border-radius: 16px;
      padding: 10px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111;
      text-align: center;
      margin-bottom: 14px;
      transition: transform 0.1s ease;
      text-decoration: none;
      color: #111;
      display: block;
    }
    .nav-box-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #111; }
    .nav-box-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px #222; }

    .nav-box-btn-dark {
      width: 100%;
      background: #111111;
      color: #ffffff;
      border: 2px solid #111;
      border-radius: 16px;
      padding: 10px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111;
      text-align: center;
      margin-bottom: 14px;
      transition: transform 0.1s ease;
      text-decoration: none;
      display: block;
    }
    .nav-box-btn-dark:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #333; }
    .nav-box-btn-dark:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px #111; }

    .pure-card-img {
      max-width: 100%;
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(4px 4px 0px #111);
      transition: transform 0.15s ease;
    }
    .pure-card-img:hover { transform: translateY(-2px); }
  </style>
</head>
